# One entry per niche. Each collector reads only its own key; a missing or empty key
# means that source is skipped for the niche (never a crash).
#
# google_play_apps must be real package ids from the Colombian store; a wrong id is
# logged and skipped. Check one with:
#   uv run python -c "from google_play_scraper import app; print(app('<id>', lang='es', country='co')['title'])"
#
# Reachability (`niche-miner review`, scored per niche by channel type):
#   computrabajo_queries   job titles; posts in the last 30 days are counted per city
#   buyer_roles            who pays in this niche; a cluster's reachability is the niche value ×
#                          the share of its pains whose `who` starts with one of these words
#                          (accents ignored; an unknown `who` counts 0.7). Unset: no discount.
#   name                   optional, for the gremio search "<name> asociación Colombia"
#                          (default: the tag with spaces)
#   facebook_group_members optional {group url: members}, by hand until a collector finds them
#   whatsapp_communities   optional [{name: ..., members: N}], by hand

niches:
  - tag: contadores_pymes
    google_play_apps:
      - com.siigo.nubeapp        # Siigo Nube App (2.2★, 50k+ installs)
      - co.alegra.app            # Alegra (4.9★, 100k+)
      - siigo.siigo_a_la_orden   # Siigo A La Orden (2.2★)
      - com.worldoffice.mobile   # World Office Cloud (4.0★)
      - co.com.psl.loggro        # Loggro (3.1★)
      # High-volume options if you want more micro-business signal:
      # - com.treintaapp         # Treinta – gestiona tu negocio (10M+)
      # - com.nequi.negocios     # Nequi Negocios (100k+)
    # The keys below are read by collectors added in later steps (2–3).
    # Mercado Libre is parked (2026-11-09): no collector reads this key. See README "Sources".
    mercadolibre_queries: ["software contable", "facturación electrónica"]
    # Video ids or URLs. Picked 2026-11-09 by topic (checked to exist; comment counts unknown
    # until the first run, which logs how many comments each video gave).
    youtube_video_ids:
      - Niqto0rumHQ   # Soporte Tributario Integral: facturar gratis en la DIAN, guía 2026
      - 0AM-WHShurw   # Soporte Tributario Integral: primera factura en el software gratuito DIAN
      - MqqsE8LQdvU   # Ray Blker: factura electrónica en la plataforma DIAN gratis 2024
      - miTBZX7WcLU   # Martinez Contadores: factura en la plataforma gratuita de la DIAN
      - T6rytA1Uo0w   # Accounterweb: nómina electrónica con el sistema gratuito DIAN
      - 7AcvKHPmhGs   # SEDI Solutions: nómina electrónica DIAN mediante Excel
      - OeqZA_QB068   # Actualícese: habilitación de nómina electrónica en la DIAN
      - AWJNC_JSYko   # Franklin Salazar: facturas electrónicas en Siigo Nube
      - nq7fqrZAUYM   # Innovación Siigo: facturación electrónica en Siigo Nube
    computrabajo_queries: ["auxiliar contable excel", "conciliación bancaria"]
    # Apify sources (need APIFY_TOKEN; cost per target in config/settings.yaml).
    facebook_groups: []          # public groups only, e.g. "https://www.facebook.com/groups/<id>"
    gmaps_queries: ["software contable Bogotá"]   # a Google Maps search: places + their reviews
    tiktok_hashtags: ["contadorescolombia"]       # without the #
    # Buyer = the business that pays AND its contador (user, 2026-11-10: both).
    buyer_roles: [dueño, dueña, propietario, propietaria, negocio, comerciante, empresa,
                  compañía, emprendedor, pyme, microempresa, gerente, administrador,
                  representante, emisor, factura, vendedor, importador, fabricante,
                  distribuidora, tienda, restaurante, cooperativa, empleador, entidad,
                  institución, multinacional, prestador, persona natural,
                  contador, contadora, contable, auxiliar contable, revisor fiscal, firma contable]

